name: 发布插件 Release

on:
  push:
    tags:
      - '*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 读取版本号（从 manifest.json）
        id: version
        run: |
          VERSION=$(jq -r '.version' manifest.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "插件版本: $VERSION"

      - name: 安装依赖
        run: npm ci

      - name: Vite 构建（混淆压缩）
        run: npm run build

      - name: 打包 dist/ 为 zip
        run: |
          VERSION=${{ steps.version.outputs.version }}
          cd dist
          zip -r "$GITHUB_WORKSPACE/ai_root_english_v${VERSION}.zip" .
          echo "打包完成，大小：$(du -sh "$GITHUB_WORKSPACE/ai_root_english_v${VERSION}.zip" | cut -f1)"
          echo "=== 打包内容 ==="
          ls -la

      - name: 创建 GitHub Release 并上传 zip
        uses: softprops/action-gh-release@v2
        with:
          name: "Ai词根分析 v${{ steps.version.outputs.version }}"
          body: |
            ## 📦 安装方式
            1. 下载下方的 `.zip` 文件
            2. 解压到本地文件夹
            3. 打开 `chrome://extensions/` → 开启**开发者模式**
            4. 点击**加载已解压的扩展程序** → 选择解压后的文件夹

            ## 更新日志
            > 请在此处手动填写本次更新内容
          files: ${{ github.workspace }}/ai_root_english_v${{ steps.version.outputs.version }}.zip
          draft: false
          prerelease: false