<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="js/popup.css">
</head>
<body data-theme="system">
  <div class="header">
    <div class="header-title" id="app-logo"><img src="icons/ui_128.png" alt="icon"><span style="font-size:14px; font-weight:800; margin-left:8px;">词根</span></div>
    <div class="header-right">
      <label class="switch-wrap" data-tooltip="🛡️ 护根模式&#10;防止新解析覆盖您的旧笔记">
        <label class="switch">
          <input type="checkbox" id="root-toggle-switch">
          <span class="slider"></span>
        </label>
        护根
      </label>
      <select id="quick-engine" class="quick-select">
        <option value="custom">🌐 API</option>
        <option value="ollama">🦙 Ollama</option>
        <option value="local_only">💾 离线</option>
      </select>
      <select id="quick-context" class="quick-select">
        <option value="general">🌍 日常</option>
        <option value="civ6">🏛️ 文明6</option>
        <option value="linux_ai">🐧 极客</option>
        <option value="custom">✍️ 自定义</option>
      </select>
      <button id="pin-window-btn" class="icon-btn" data-tooltip="📌 窗口驻留&#10;分离为独立窗口防误触消失">📌</button>
      <button id="settings-btn" class="icon-btn" data-tooltip="⚙️ 偏好设置&#10;管理特训库与引擎数据">⚙️</button>
    </div>
  </div>

  <div id="back-area" style="display: none; margin-bottom: 12px;"></div>

  <div class="input-row">
    <input type="text" id="word-input" class="word-input" placeholder="输入要拆解的单词/词根..." autocomplete="off" spellcheck="false" />
    <button id="search-btn" class="search-btn" data-tooltip="🔍 智能解析&#10;调用当前 AI 引擎拆解单词">🔍</button>
    <button id="regen-btn" class="search-btn" style="background: var(--orange);" data-tooltip="🔄 强制重算&#10;无视本地缓存强制生成新解析">🔄</button>
  </div>
  
  <div id="history-container">
    <span style="font-size:12px; color:var(--text-muted); white-space:nowrap;">🕒 历史:</span>
    <select id="history-select" class="history-select">
      <option value="">-- 选择历史记录 --</option>
    </select>
  </div>
  
  <div id="result-container">
    <div class="welcome-box">
      <h3 style="margin:0 0 10px 0; color:var(--text);">✨ AI 词根解析引擎就绪</h3>
      <div style="font-size:13px; color:var(--text-muted);">
        • 划词交互防误触，即指即译<br>
        • 多模型、多情景数据库完全隔离<br>
        • 独立的词根与渊源故事库保护
      </div>
    </div>
  </div>

  <script src="js/popup.js"></script>
</body>
</html>
