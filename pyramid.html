<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>词根金字塔 - 词汇引擎 Pro</title>
  <link rel="stylesheet" href="css/options.css">
  <style>
    body { background: #09090b; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 40px; margin: 0; min-height: 100vh; box-sizing: border-box; }
    .pyramid-container { max-width: 800px; width: 100%; display: flex; flex-direction: column; align-items: center; }
    .search-bar { display: flex; gap: 10px; margin-bottom: 40px; width: 100%; max-width: 500px; }
    .search-bar input { flex: 1; padding: 12px 16px; border-radius: 8px; border: 1px solid #3f3f46; background: #18181b; color: #fff; outline: none; font-size: 15px; }
    .search-bar button { padding: 12px 24px; border-radius: 8px; border: none; background: #facc15; color: #111; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 15px; }
    .search-bar button:hover { background: #eab308; }
    
    .loading-state { color: #facc15; font-size: 18px; margin-top: 40px; display: none; }
    
    .meaning { font-size: 28px; font-weight: bold; color: #fff; margin-bottom: 30px; text-align: center; }
    .arrows { display: flex; justify-content: center; gap: 60px; margin-bottom: 30px; width: 100%; }
    .arrow { font-size: 40px; color: #52525b; }
    .arrow-left { transform: rotate(-30deg); }
    .arrow-right { transform: rotate(30deg); }
    .root-base { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-bottom: 50px; }
    .root-box { background: #18181b; border: 2px solid #facc15; color: #facc15; padding: 16px 32px; border-radius: 40px; font-size: 24px; font-weight: bold; box-shadow: 0 4px 15px rgba(250, 204, 21, 0.15); }
    
    .origin-box { background: #18181b; padding: 24px; border-radius: 12px; width: 100%; border: 1px solid #27272a; margin-bottom: 40px; line-height: 1.6; }
    .origin-title { font-size: 18px; font-weight: bold; color: #facc15; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .origin-text { color: #d4d4d8; font-size: 16px; }
    
    .deriv-box { width: 100%; }
    .deriv-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: #e4e4e7; }
    .deriv-list { display: flex; flex-wrap: wrap; gap: 12px; }
    .deriv-item { background: #27272a; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; color: #fff; border: 1px solid #3f3f46; }
    .deriv-item:hover { background: #3f3f46; border-color: #facc15; color: #facc15; }
  </style>
</head>
<body>
  <div class="pyramid-container">
    <div style="font-size: 24px; font-weight: bold; color: #facc15; margin-bottom: 30px; display: flex; align-items: center; gap: 10px;">
      🔺 词根金字塔
    </div>
    
    <div class="search-bar">
      <input type="text" id="pyramid-search" placeholder="输入核心词根生成金字塔 (例如: vis)...">
      <button id="pyramid-btn">生成金字塔</button>
    </div>
    
    <div id="loading" class="loading-state">⏳ 正在解析词根金字塔...</div>
    
    <div id="pyramid-content" style="display: none; width: 100%; align-items: center; flex-direction: column;">
      <div class="meaning" id="pyramid-meaning"></div>
      <div class="arrows">
        <div class="arrow arrow-left">⬆</div>
        <div class="arrow">⬆</div>
        <div class="arrow arrow-right">⬆</div>
      </div>
      <div class="root-base" id="pyramid-roots"></div>
      
      <div class="origin-box" id="pyramid-origin-box">
        <div class="origin-title">💡 词源解析</div>
        <div class="origin-text" id="pyramid-origin"></div>
      </div>
      
      <div class="deriv-box" id="pyramid-deriv-box">
        <div class="deriv-title" id="pyramid-deriv-title">派生词汇</div>
        <div class="deriv-list" id="pyramid-derivs"></div>
      </div>
    </div>
  </div>
  
  <script src="js/global.js"></script>
  <script src="js/pyramid.js"></script>
</body>
</html>
